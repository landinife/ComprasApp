// Celda CSV compatible con Excel en español (separador ; y coma decimal)
function celda(v){ if(v==null) return ''; if(typeof v==='number') return String(v).replace('.',','); return '"'+String(v).replace(/"/g,'""')+'"'; }
function aCSV(filas){ return '\ufeff'+filas.map(f=>f.map(celda).join(';')).join('\r\n'); }
function exportarOCsCSV(){
  const f=[['Número','Estado','Fecha emisión','Fecha necesidad','Proveedor','CUIT proveedor','Razón social','CUIT razón social','Destino','Código destino','Moneda','Tipo de cambio','Discrimina IVA','IVA %','Subtotal','IVA','Total','Condición de pago','Lugar de entrega','N° factura','Fecha factura','Monto facturado','Fecha pago','Forma de pago','Observaciones']];
  S.ocs.forEach(o=>{ const p=o.proveedorSnap||{}, r=o.razonSnap||{}, d=o.destinoSnap||{}, fa=o.factura||{}, pa=o.pago||{};
    f.push([o.numero,nombreEstado(o.estado),fmtFecha(o.fechaEmision),fmtFecha(o.fechaNecesidad),p.razonSocial,p.cuit,r.nombre,r.cuit,d.nombre,d.codigo,o.moneda,o.tipoCambio,o.discriminarIva?'Sí':'No',o.ivaPct,o.subtotal,o.iva,o.total,o.condicionPago,o.lugarEntrega,fa.numero,fa.fecha?fmtFecha(fa.fecha):'',fa.monto,pa.fecha?fmtFecha(pa.fecha):'',pa.forma,o.observaciones]); });
  descargar('ComprasApp_OC_'+hoy()+'.csv',aCSV(f),'text/csv;charset=utf-8');
}
function exportarItemsCSV(){
  const f=[['Número OC','Estado','Fecha emisión','Proveedor','Destino','Moneda','Ítem','Código','Descripción','Cantidad','Unidad','Precio unitario','Total ítem']];
  S.ocs.forEach(o=>(o.items||[]).forEach(it=>f.push([o.numero,nombreEstado(o.estado),fmtFecha(o.fechaEmision),(o.proveedorSnap||{}).razonSocial,(o.destinoSnap||{}).nombre,o.moneda,it.n,it.codigo,it.descripcion,it.cantidad,it.unidad,it.precioUnit,it.total])));
  descargar('ComprasApp_items_'+hoy()+'.csv',aCSV(f),'text/csv;charset=utf-8');
}
// Convierte fechas de Firestore a texto para el respaldo
function limpiar(v){
  if(v instanceof firebase.firestore.Timestamp) return v.toDate().toISOString();
  if(Array.isArray(v)) return v.map(limpiar);
  if(v&&typeof v==='object'){ const o={}; for(const k in v) o[k]=limpiar(v[k]); return o; }
  return v;
}
async function exportarRespaldo(){
  try{
    const [oc,pr,co,cf,re,pc]=await Promise.all([db.collection(COL.oc).get(),db.collection(COL.prov).get(),db.collection(COL.cont).get(),db.doc(COL.cfg+'/general').get(),db.collection(COL.rec).get(),db.collection(COL.precios).get()]);
    const docs=q=>q.docs.map(d=>({id:d.id,...limpiar(d.data())}));
    const data={app:'ComprasApp',version:1,fecha:new Date().toISOString(),config:cf.exists?limpiar(cf.data()):null,proveedores:docs(pr),oc:docs(oc),contadores:docs(co),recepciones:docs(re),precios:docs(pc)};
    descargar('ComprasApp_respaldo_'+hoy()+'.json',JSON.stringify(data),'application/json');
  }catch(e){ errorFS(e); }
}
async function importarRespaldo(input){
  const file=input.files[0]; if(!file) return;
  let d; try{ d=JSON.parse(await file.text()); }catch(e){ input.value=''; return toast('Archivo inválido'); }
  input.value='';
  if(d.app!=='ComprasApp') return toast('El archivo no es un respaldo de ComprasApp');
  if(!confirm(`Se importarán ${(d.oc||[]).length} OC y ${(d.proveedores||[]).length} proveedores. Los registros con el mismo número se reemplazan. ¿Continuar?`)) return;
  const sinId=x=>{ const {id,...r}=x; return r; };
  const ops=[];
  if(d.config) ops.push([db.doc(COL.cfg+'/general'),d.config]);
  (d.proveedores||[]).forEach(p=>ops.push([db.collection(COL.prov).doc(p.id),sinId(p)]));
  (d.oc||[]).forEach(o=>ops.push([db.collection(COL.oc).doc(o.id),sinId(o)]));
  (d.contadores||[]).forEach(c=>ops.push([db.collection(COL.cont).doc(c.id),sinId(c)]));
  (d.recepciones||[]).forEach(r=>ops.push([db.collection(COL.rec).doc(r.id),sinId(r)]));
  (d.precios||[]).forEach(x=>ops.push([db.collection(COL.precios).doc(x.id),sinId(x)]));
  try{
    for(let i=0;i<ops.length;i+=400){ const b=db.batch(); ops.slice(i,i+400).forEach(([ref,data])=>b.set(ref,data,{merge:true})); await b.commit(); }
    toast('Respaldo importado');
  }catch(e){ errorFS(e); }
}
