<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151a20">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ComprasApp</title>
<!-- Firebase (versión compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* TEMA VIDRIO (unificado con StockApp y ProducciónApp): fondo oscuro con brillos, paneles translúcidos, Barlow / Barlow Condensed */
:root{--bg:#0f1319;--solid:#1a2029;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.085);--border:rgba(220,232,245,.13);--text:#eaf0f6;--muted:#9fb0c1;--accent:#4fb0ff;--accent-ink:#04203a;--ok:#2fcf7a;--warn:#f2b437;--bad:#f0625a;--violet:#a98bff;
  --input:rgba(255,255,255,.05);--btn:rgba(255,255,255,.07);--btn-h:rgba(255,255,255,.14);--float:rgba(24,30,38,.94);--velo:rgba(5,7,10,.5);--head:rgba(18,23,30,.78);--nav:rgba(16,21,28,.72);
  --shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.32);
  --brillos:radial-gradient(900px 560px at 8% -8%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 68%),radial-gradient(820px 640px at 102% 18%,rgba(110,96,220,.16),transparent 68%),radial-gradient(900px 620px at 55% 108%,rgba(46,150,140,.15),transparent 68%);
  --f-tit:"Barlow Condensed","Arial Narrow",sans-serif;--f-txt:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
/* Tema claro: solo si se elige en Configuración */
:root[data-theme="light"]{--bg:#eef2f7;--solid:#fff;--card:#fff;--card2:#f4f7fb;--border:#d3dce7;--text:#16202c;--muted:#5c6b7d;--accent:#1f7ae0;--accent-ink:#fff;--ok:#16a35a;--warn:#b97f00;--bad:#d63b31;--violet:#7357d9;
  --input:#fff;--btn:#f4f7fb;--btn-h:#e3eaf3;--float:rgba(255,255,255,.97);--velo:rgba(20,30,45,.35);--head:rgba(255,255,255,.82);--nav:rgba(255,255,255,.82);
  --shadow:0 1px 4px rgba(20,40,70,.08);--brillos:none;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background-color:var(--bg)}
html,body{margin:0;color:var(--text);font-family:var(--f-txt);font-size:16px}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
/* Fondo fijo con los tres brillos */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--brillos);pointer-events:none}
/* Encabezado: barra de vidrio fija arriba */
header{position:sticky;top:0;z-index:20;background:var(--head);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border:1px solid var(--border);border-top:0;border-radius:0 0 18px 18px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.marca{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.marca h1{font-family:var(--f-tit);font-weight:700;font-size:27px;margin:0;letter-spacing:.3px}
.marca h1 span{color:var(--accent)}
/* Accesos a las otras apps */
.app-link{flex:0 0 auto;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--btn);border:1px solid var(--border)}
.app-link:hover{background:var(--btn-h)}
.app-link svg{width:30px;height:30px;border-radius:7px;display:block}
main{max-width:900px;margin:0 auto;padding:16px}
h2,h3{font-family:var(--f-tit);font-weight:700;text-transform:uppercase;letter-spacing:.6px;text-wrap:balance}
h2{font-size:23px}h3{font-size:18px;margin:0 0 10px}
.titulo-sec{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.titulo-sec::before{content:"";width:5px;height:22px;border-radius:3px;background:var(--accent)}
.vista{display:none}.vista.activa{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--input);color:var(--text);font-family:inherit}
option,optgroup{background:var(--solid);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px;border-color:var(--accent)}
input:disabled{opacity:.6}
textarea{min-height:70px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;vertical-align:middle;margin-right:6px;accent-color:var(--accent)}
a{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--btn);color:var(--text);font-family:var(--f-txt);font-size:16px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--btn-h)}
.btn.pri,.btn.pri:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.peligro{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 60%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.btn.peligro:hover{background:color-mix(in srgb,var(--bad) 16%,transparent)}
.btn.chico{min-height:36px;padding:6px 12px;font-size:15px}
.btn.icono{min-width:44px;padding:8px;flex:0 0 auto}
.btn:disabled{opacity:.5}
.btn:focus-visible,.tile:focus-visible,.fab:focus-visible,.app-link:focus-visible,nav.inferior button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fila{display:flex;gap:10px;flex-wrap:wrap}.fila>*{flex:1 1 140px;min-width:0}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.acciones .btn{flex:1 1 140px}
.lin{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
/* Navegación — teléfono: barra de vidrio fija abajo, lugares iguales */
nav.inferior{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--nav);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--border);border-bottom:0;border-radius:18px 18px 0 0;display:flex;gap:4px;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.inferior button{flex:1 1 0;min-width:0;height:58px;background:none;border:0;border-radius:14px;color:var(--muted);padding:0 2px;font-family:var(--f-txt);font-weight:600;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
nav.inferior button svg{width:22px;height:22px;flex:0 0 auto;color:var(--ic,var(--muted))}
/* Color propio de cada sección (como en StockApp) */
nav.inferior button[data-v="inicio"]{--ic:var(--accent)}
nav.inferior button[data-v="metricas"]{--ic:var(--ok)}
nav.inferior button[data-v="proveedores"]{--ic:var(--warn)}
nav.inferior button[data-v="config"]{--ic:var(--muted)}
nav.inferior button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav.inferior button:hover{background:var(--btn)}
nav.inferior button.activo{color:var(--text);background:color-mix(in srgb,var(--ic,var(--accent)) 18%,transparent)}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:25;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 22px color-mix(in srgb,var(--accent) 45%,transparent),0 4px 12px rgba(0,0,0,.35)}
/* Navegación — PC: barra lateral fija de íconos (igual que StockApp); al acercar el mouse se despliega con los nombres; Configuración abajo de todo */
@media(min-width:900px){
  body{padding-bottom:110px}
  main{max-width:1000px;padding-left:96px}
  nav.inferior{top:76px;bottom:12px;left:12px;right:auto;width:62px;flex-direction:column;align-items:stretch;gap:6px;padding:8px;overflow:hidden;border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);transition:width .18s ease,background .18s ease}
  nav.inferior:hover,nav.inferior:focus-within{width:214px;background:var(--float)}
  nav.inferior button{flex:0 0 auto;width:100%;height:46px;flex-direction:row;justify-content:flex-start;gap:14px;padding:0 12px;font-size:15px;border-radius:12px}
  nav.inferior button span{overflow:visible;opacity:0;transition:opacity .12s ease}
  nav.inferior:hover button span,nav.inferior:focus-within button span{opacity:1}
  nav.inferior button[data-v="config"]{margin-top:auto}
  .fab{bottom:28px;right:28px}
  #toast{bottom:104px}
}
/* Cuadros de alerta */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{--c:var(--accent);text-align:left;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--border);border-top:3px solid var(--c);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;color:var(--text);cursor:pointer;font-family:inherit;min-width:0;box-shadow:var(--shadow)}
.tile.t-bad{--c:var(--bad)}.tile.t-warn{--c:var(--warn)}.tile.t-ok{--c:var(--ok)}.tile.t-muted{--c:var(--muted)}.tile.t-violet{--c:var(--violet)}
.tile-lbl{font-family:var(--f-tit);font-weight:700;text-transform:uppercase;letter-spacing:1.2px;font-size:14px;color:var(--muted)}
.tile-num{font-family:var(--f-tit);font-weight:700;font-size:38px;line-height:1.05;color:var(--c);font-variant-numeric:tabular-nums}
.tile-sub{font-size:13px;color:var(--muted)}
.tile.vacio{opacity:.6}.tile.vacio .tile-num{color:var(--muted)}
.tile.activo{box-shadow:0 0 0 2px var(--c),0 0 18px color-mix(in srgb,var(--c) 35%,transparent);opacity:1}
.filtro-tile{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding:8px 12px;border-radius:10px;border:1px dashed var(--border);color:var(--muted);font-size:14px}
/* Tarjetas de OC */
.oc-card{cursor:pointer;border-left:4px solid var(--border)}
.oc-card.sem-rojo{border-left-color:var(--bad)}.oc-card.sem-amarillo{border-left-color:var(--warn)}.oc-card.sem-verde{border-left-color:var(--ok)}.oc-card.sem-gris{border-left-color:var(--muted)}
.oc-num{font-family:var(--f-tit);font-weight:700;font-size:20px;letter-spacing:.4px}
.oc-total{font-family:var(--f-tit);font-weight:700;font-size:19px;white-space:nowrap;font-variant-numeric:tabular-nums}
.oc-prov{font-weight:600;margin:2px 0 4px}
.oc-dias{font-size:14px;margin-top:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--muted)}
.dot.verde{background:var(--ok)}.dot.amarillo{background:var(--warn)}.dot.rojo{background:var(--bad)}
.txt-rojo{color:var(--bad);font-weight:600}.txt-amarillo{color:var(--warn);font-weight:600}.txt-verde{color:var(--ok);font-weight:600}.txt-gris{color:var(--muted)}
.badge{--c:var(--muted);display:inline-block;padding:3px 9px;border-radius:6px;font-family:var(--f-tit);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.badge.emitida{--c:var(--accent)}.badge.parcial{--c:var(--warn)}.badge.recibida{--c:var(--ok)}.badge.facturada{--c:var(--violet)}.badge.pagada{--c:var(--ok)}.badge.anulada{--c:var(--bad)}
.muted{color:var(--muted);font-size:14px}
/* Ventana emergente: velo con desenfoque y caja densa */
#modal{position:fixed;inset:0;background:var(--velo);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:none;z-index:50;align-items:flex-end;justify-content:center}
#modal.abierto{display:flex}
#modal .caja{background:var(--float);border:1px solid var(--border);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 20px 60px rgba(0,0,0,.45)}
#modal .caja.ancho{max-width:860px}
@media(min-width:700px){#modal{align-items:center}#modal .caja{border-radius:20px}}
.pdf-hojas{display:flex;flex-direction:column;gap:12px;margin:10px 0}
.pdf-hojas canvas{background:#fff;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.35);max-width:100%}
#toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--float);color:var(--text);border:1px solid var(--accent);padding:10px 16px;border-radius:12px;z-index:60;display:none;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.32)}
#offline{display:none;background:var(--bad);color:#fff;text-align:center;padding:6px;font-size:14px}
/* Formulario */
.item{border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--card2)}
.item-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-tit);font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-size:16px}
.totales div{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.totales .tot{font-family:var(--f-tit);font-size:23px;font-weight:700;border-top:1px solid var(--border);padding-top:8px}
.lista-sel>div{padding:12px 6px;border-bottom:1px solid var(--border);cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--border);margin:4px;background:var(--card2)}
.chip button{background:none;border:0;color:var(--bad);font-size:16px;cursor:pointer}
/* Secciones plegables */
details.card>summary{list-style:none;display:flex;align-items:center;gap:12px;font-family:var(--f-tit);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.6px;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"▸";color:var(--accent);font-size:15px;padding-left:12px;border-left:5px solid var(--accent);border-radius:2px;line-height:22px}
details.card[open]>summary::before{content:"▾"}
details.card[open]>summary{margin-bottom:10px}
.centro{text-align:center}
.tabla-items{width:100%;border-collapse:collapse;font-size:15px}
.tabla-items td,.tabla-items th{padding:6px 4px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.tabla-items th{font-family:var(--f-tit);text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
.tabla-items .der{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.prov-sel{display:flex;gap:8px}.prov-sel .btn:first-child{flex:1;justify-content:flex-start;text-align:left}
.logo-prev{max-height:60px;max-width:160px;display:block;margin:6px 0;background:#fff;border-radius:6px}
.login{max-width:420px;margin:60px auto;text-align:center}
.vinculo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.pista{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.7}
.pista b{color:var(--text)}
.chk{display:flex;align-items:center;gap:6px;color:var(--text);font-size:15px;margin:10px 0}
.chk-fila{cursor:pointer;margin:0 0 8px}.chk-fila span{display:flex;align-items:center;color:var(--text);font-size:15px}
.periodos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.periodos .btn.activo{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.met-mon{font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
.barras{display:flex;flex-direction:column;gap:8px}
.barra-f{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:14px}
.barra-f .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra-f .val{font-variant-numeric:tabular-nums;color:var(--muted)}
.barra-f .pista-b{grid-column:1/-1;height:8px;border-radius:4px;background:color-mix(in srgb,var(--muted) 18%,transparent);overflow:hidden}
.barra-f .pista-b i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.meses{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:170px;padding-top:18px}
.mes{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.mes .col{width:70%;max-width:26px;border-radius:3px 3px 0 0;background:color-mix(in srgb,var(--accent) 55%,transparent);min-height:1px}
.mes.actual .col{background:var(--accent)}
.mes .v{font-size:10px;color:var(--muted);white-space:nowrap}
.mes .m{font-family:var(--f-tit);font-size:12px;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="offline">Sin conexión a internet. Los cambios se guardan y se sincronizan al volver la conexión.</div>
<header>
  <div class="marca"><h1>Compras<span>App</span></h1></div>

<script>
// =====================================================================
// 1) CONFIGURACIÓN DE FIREBASE
// Pegá acá la configuración web del MISMO proyecto que usa StockApp.
// Estos datos NO son secretos: la protección la dan las reglas de Firestore.
// =====================================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBgZLlQqkzYFMjMPWupO5R7nhVyNR_s8Lk",
  authDomain: "tpfapps-5f226.firebaseapp.com",
  projectId: "tpfapps-5f226",
  storageBucket: "tpfapps-5f226.firebasestorage.app",
  messagingSenderId: "177510210481",
  appId: "1:177510210481:web:1fc7574a6f04d76a40fb90"
};

// Colecciones propias de ComprasApp (separadas de StockApp)
const COL = {
  oc: 'compras_oc',               // órdenes de compra (id = AAMM-NNN)
  prov: 'compras_proveedores',    // catálogo de proveedores
  cfg: 'compras_config',          // doc "general"
  cont: 'compras_contadores',     // un doc por mes (AAMM) con el último correlativo
  rec: 'compras_recepciones',     // FASE 2/3: recepciones por ítem / remitos
  precios: 'compras_precios'      // historial de precios por ítem y proveedor
};
// Colecciones de StockApp que usa ComprasApp (mismo proyecto de Firebase)
const SCOL = { items:'stockapp_items', movs:'stockapp_movimientos', cfg:'stockapp_config', usuarios:'stockapp_usuarios' };
// Administrador: el mismo de StockApp y de las reglas de Firebase
const ADMIN_EMAIL = 'flandinitpf@gmail.com';
// Secciones de StockApp (prefijo del código; tec = lleva medidas)
const AREAS = {panol:{n:'Pañol',p:'PA'},aceros:{n:'Aceros',p:'AC',tec:1},noferrosos:{n:'No ferrosos',p:'NF',tec:1},plasticos:{n:'Plásticos',p:'PL',tec:1},componentes:{n:'Componentes',p:'CO'}};

const ESTADOS = [
  {id:'borrador', nombre:'Borrador'},
  {id:'emitida', nombre:'Emitida'},
  {id:'parcial', nombre:'Recepción parcial'},
  {id:'recibida', nombre:'Recibida'},
  {id:'facturada', nombre:'Facturada'},
  {id:'pagada', nombre:'Pagada'},
  {id:'anulada', nombre:'Anulada'}
];
const FORMAS_PAGO = ['Transferencia','Efectivo','Cheque','E-cheq','Tarjeta','Otro'];
const COND_IVA = ['Responsable Inscripto','Monotributista','Exento','Consumidor Final'];

const CFG_DEFECTO = {
  razones: [],
  destinos: [
    {id:'stock', nombre:'Stock', tipo:'general', codigo:'', archivado:false},
    {id:'taller', nombre:'Taller', tipo:'general', codigo:'', archivado:false}
  ],
  semaforo: {amarillo:7, rojo:2},
  unidades: ['u','kg','m','m²','l','barra','chapa','juego','caja','hs'],
  dolarMet: 'oficial'   // dólar para pasar las OC en pesos a USD en métricas
};

// Estado general de la app en memoria
const S = {
  user:null, email:'', cfg:null,
  ocs:[], provs:[], form:null, detalleId:null, vista:'',
  filtros:{texto:'',estado:'',destino:'',proveedor:'',moneda:'',razon:'',desde:'',hasta:'',tile:''},
  verFiltros:false, logoTmp:{}, unsub:[],
  esAdmin:false, nombre:'', usuarios:[], stock:{items:[],cfg:{}}, recs:[], precios:{}, matItem:0, metPeriodo:'anio',
  dolar:{casa:'',hoy:null,serie:null,cargando:null,listo:false}, revTC:[]
};

// ===== Inicio de Firebase =====
let auth=null, db=null, errorInicio='';
try{
  if(typeof firebase==='undefined') throw new Error('No se cargaron las librerías de Firebase (revisá la conexión a internet).');
  if(!FIREBASE_CONFIG.apiKey) throw new Error('Falta pegar la configuración de Firebase en FIREBASE_CONFIG (al principio del código).');
  if(location.protocol==='file:') throw new Error('La app no funciona abierta como archivo: hay que abrirla desde GitHub Pages (https://...).');
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth(); db=firebase.firestore();
  db.settings({ignoreUndefinedProperties:true});
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); // trabajo sin conexión
}catch(e){ errorInicio=e.message; console.error(e); }
const ts = () => firebase.firestore.FieldValue.serverTimestamp();

// =====================================================================
// 2) UTILIDADES
// =====================================================================
const $ = id => document.getElementById(id);
// Escapa texto para insertarlo en HTML
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Convierte texto a número (acepta coma decimal)
function num(v){ if(typeof v==='number') return isFinite(v)?v:0; const n=parseFloat(String(v??'').replace(',','.')); return isFinite(n)?n:0; }
const redondear = n => Math.round(n*100)/100;
const sel = (a,b) => a===b ? 'selected' : '';
// Fecha de hoy en formato AAAA-MM-DD (hora local)
function hoy(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtFecha(f){ if(!f) return '—'; const [a,m,d]=f.slice(0,10).split('-'); return `${d}/${m}/${a}`; }
function fmtFechaHora(iso){ const d=new Date(iso); return d.toLocaleDateString('es-AR')+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); }
// Días que faltan hasta una fecha (negativo = vencida)
function diasHasta(f){ const a=new Date(f+'T00:00:00'), h=new Date(hoy()+'T00:00:00'); return Math.round((a-h)/86400000); }
function fmtNum(n,dec=2){ return num(n).toLocaleString('es-AR',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function fmtCant(n){ return num(n).toLocaleString('es-AR',{maximumFractionDigits:3}); }
function fmtMon(n,mon){ return (mon==='USD'?'US$ ':'$ ')+fmtNum(n); }
const nombreEstado = id => (ESTADOS.find(e=>e.id===id)||{}).nombre || id;

function toast(msg,ms=2800){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',ms); }
function abrirModal(html,clase){ $('modal-caja').className='caja '+(clase||''); $('modal-caja').innerHTML=html; $('modal').classList.add('abierto'); }
function cerrarModal(){ $('modal').classList.remove('abierto'); }
// Mensajes de error de Firestore entendibles
function errorFS(e){ console.error(e); if(e&&e.code==='permission-denied') toast('Sin permiso para esta acción (revisá las reglas o los correos autorizados).',4000); else toast('Error: '+(e&&e.message||e),4000); }
// Ejecuta una escritura: con internet espera la confirmación; sin internet queda en cola
async function escribir(promesa,msgOk){ try{ if(navigator.onLine){ await promesa; if(msgOk) toast(msgOk); } else { promesa.catch(errorFS); toast('Guardado sin conexión: se sincroniza al volver internet'); } return true; }catch(e){ errorFS(e); return false; } }
function entradaHist(estado,nota){ return {estado, fecha:new Date().toISOString(), usuario:S.email, nota:nota||''}; }
function descargar(nombre,contenido,tipo){ const b=new Blob([contenido],{type:tipo}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=nombre; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); }

// ===== Tema: oscuro (vidrio) por defecto; el claro se elige en Configuración =====
function temaActual(){ let t=null; try{t=localStorage.getItem('compras_tema');}catch(e){} return t==='light'?'light':'dark'; }
function aplicarTema(){ const t=temaActual(); document.documentElement.dataset.theme=t;
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=t==='light'?'#eef2f7':'#151a20'; }
function elegirTema(t){ try{localStorage.setItem('compras_tema',t);}catch(e){} aplicarTema(); }
aplicarTema();

// ===== Aviso de conexión =====
function avisoConexion(){ $('offline').style.display = navigator.onLine ? 'none' : 'block'; }
addEventListener('online',avisoConexion); addEventListener('offline',avisoConexion); avisoConexion();

// =====================================================================
// 3) INGRESO Y AUTORIZACIÓN
// =====================================================================
async function entrar(){
  const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
  try{ await auth.signInWithPopup(p); }
  catch(e){ if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)) await auth.signInWithRedirect(p); else if(e.code!=='auth/popup-closed-by-user') toast('Error al ingresar: '+e.message,4000); }
}
const ERR_AUTH={'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Correo o contraseña incorrectos.','auth/user-not-found':'No existe un usuario con ese correo.','auth/invalid-email':'El correo no es válido.','auth/too-many-requests':'Demasiados intentos. Probá de nuevo en unos minutos.','auth/network-request-failed':'Sin conexión a internet.'};
async function entrarClave(ev){
  ev.preventDefault(); $('l-err').textContent='';
  try{ await auth.signInWithEmailAndPassword($('l-email').value.trim(),$('l-clave').value); }
  catch(e){ $('l-err').textContent=ERR_AUTH[e.code]||('No se pudo ingresar: '+e.code); }
}
async function olvideClave(){
  const m=$('l-email').value.trim(); if(!m){ $('l-err').textContent='Escribí tu correo y volvé a tocar el enlace.'; return; }
  try{ await auth.sendPasswordResetEmail(m); toast('Te enviamos un correo para cambiar la contraseña'); }
  catch(e){ $('l-err').textContent=ERR_AUTH[e.code]||('No se pudo enviar: '+e.code); }
}
function salir(){ S.unsub.forEach(u=>u()); S.unsub=[]; auth.signOut(); }
function sinAcceso(msg){ $('nav').style.display='none'; $('noauth-msg').textContent=msg; mostrarVista('noauth'); }

// Si Firebase no arrancó, muestra el motivo en pantalla
if(errorInicio){ mostrarVista('noauth'); document.querySelector('#v-noauth h2').textContent='No se pudo iniciar la app'; $('noauth-msg').textContent=errorInicio; }
else auth.onAuthStateChanged(async u=>{
  S.unsub.forEach(f=>f()); S.unsub=[];
  if(!u){ $('nav').style.display='none'; mostrarVista('login'); return; }
  S.user=u; S.email=(u.email||'').toLowerCase(); S.nombre=u.displayName||S.email;
  // Administrador: entra con Google (igual que en StockApp)
  S.esAdmin = S.email===ADMIN_EMAIL && (u.providerData||[]).some(p=>p.providerId==='google.com');
  if(S.esAdmin) return iniciarDatos();
  // Resto: usuario de StockApp con el permiso "Compras"
  try{
    const d=await db.collection(SCOL.usuarios).doc(S.email).get();
    if(!d.exists) return sinAcceso(`El correo ${S.email} no tiene usuario. Los usuarios se crean en StockApp (Configuración → Usuarios).`);
    const x=d.data(); if(x.nombre) S.nombre=x.nombre;
    if(!x.compras) return sinAcceso(`Tu usuario no tiene el permiso "Compras". Pedile al administrador que lo active en ComprasApp → Configuración → Usuarios.`);
    iniciarDatos();
  }catch(e){
    sinAcceso(e.code==='permission-denied' ? `El correo ${S.email} no está autorizado.` : 'No se pudo verificar el acceso (¿sin conexión?). Probá de nuevo con internet.');
  }
});

// Escucha en tiempo real configuración, OC y proveedores
function iniciarDatos(){
  $('nav').style.display='flex';
  S.unsub.push(db.doc(COL.cfg+'/general').onSnapshot(d=>{
    if(!d.exists && !d.metadata.fromCache) db.doc(COL.cfg+'/general').set(CFG_DEFECTO,{merge:true}).catch(errorFS);
    const x=d.data()||{};
    S.cfg={...CFG_DEFECTO,...x, semaforo:{...CFG_DEFECTO.semaforo,...(x.semaforo||{})}};
    refrescar(['inicio','config','detalle']);
  },errorFS));
  // Datos de StockApp: materiales, su configuración y usuarios
  S.unsub.push(db.collection(SCOL.items).onSnapshot(q=>{ S.stock.items=q.docs.map(d=>({id:d.id,...d.data()})); },errorFS));
  S.unsub.push(db.doc(SCOL.cfg+'/general').onSnapshot(d=>{ S.stock.cfg=d.data()||{}; },errorFS));
  S.unsub.push(db.collection(SCOL.usuarios).onSnapshot(q=>{ S.usuarios=q.docs.map(d=>({email:d.id,...d.data()})); refrescar(['config']); },()=>{}));
  // Recepciones e historial de precios
  S.unsub.push(db.collection(COL.rec).onSnapshot(q=>{ S.recs=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')); refrescar(['detalle']); },errorFS));
  S.unsub.push(db.collection(COL.precios).onSnapshot(q=>{ S.precios={}; q.docs.forEach(d=>S.precios[d.id]=d.data()); },errorFS));
  S.unsub.push(db.collection(COL.oc).onSnapshot(q=>{
    S.ocs=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.id.localeCompare(a.id));
    refrescar(['inicio','detalle','metricas']);
  },errorFS));
  S.unsub.push(db.collection(COL.prov).onSnapshot(q=>{
    S.provs=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.razonSocial||'').localeCompare(b.razonSocial||''));
    refrescar(['proveedores','inicio']);
  },errorFS));
  if(!S.vista || ['login','noauth'].includes(S.vista)) irA('inicio');
}

// =====================================================================
// 4) NAVEGACIÓN
// =====================================================================
function mostrarVista(v){
  S.vista=v;
  $('fab').hidden=!['inicio','detalle','metricas','proveedores','config'].includes(v); // oculto al crear/editar OC
  document.querySelectorAll('.vista').forEach(s=>s.classList.toggle('activa',s.id==='v-'+v));
  document.querySelectorAll('nav.inferior button').forEach(b=>b.classList.toggle('activo',b.dataset.v===v || (v==='detalle'&&b.dataset.v==='inicio')));
  scrollTo(0,0);
}
function irA(v){ mostrarVista(v); renderVista(v); }
function renderVista(v){ if(v==='inicio')renderInicio(); else if(v==='detalle')renderDetalle(); else if(v==='proveedores')renderProveedores(); else if(v==='metricas')renderMetricas(); else if(v==='config')renderConfig(); }
// Vuelve a dibujar la vista actual si está en la lista (sin pisar lo que se está escribiendo)
function refrescar(vistas){
  if(!vistas.includes(S.vista)) return;
  const foco=document.activeElement&&document.activeElement.id;
  if(S.vista==='inicio' && foco==='f-texto') return renderListaOC();
  if(S.vista==='proveedores' && foco==='p-buscar') return renderListaProv();
  if(S.vista==='config' && document.activeElement && document.activeElement.closest('#v-config') && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  renderVista(S.vista);
}

// =====================================================================
// 5) SEMÁFORO
// =====================================================================
// Devuelve 'verde' | 'amarillo' | 'rojo' | 'gris' | '' (borrador o sin fecha)
function semaforo(oc){
  if(['anulada','recibida','facturada','pagada'].includes(oc.estado)) return 'gris';
  if(oc.estado==='borrador' || !oc.fechaNecesidad) return '';
  const d=diasHasta(oc.fechaNecesidad), s=(S.cfg||CFG_DEFECTO).semaforo;
  if(d<=num(s.rojo)) return 'rojo';
  if(d<=num(s.amarillo)) return 'amarillo';
  return 'verde';
}
function textoDias(oc){
  if(!oc.fechaNecesidad || !['emitida','parcial'].includes(oc.estado)) return '';
  const d=diasHasta(oc.fechaNecesidad);
  if(d<0) return `Vencida hace ${-d} día${d===-1?'':'s'}`;
  if(d===0) return 'Vence hoy';
  return `Falta${d===1?'':'n'} ${d} día${d===1?'':'s'}`;
}

// =====================================================================
// 6) PANTALLA INICIAL: ALERTAS + LISTADO + FILTROS
// =====================================================================
function tarjetaOC(o){
  const sem=semaforo(o), td=textoDias(o);
  const prov=o.proveedorSnap?o.proveedorSnap.razonSocial:'(sin proveedor)';
  const dest=o.destinoSnap?(o.destinoSnap.nombre+(o.destinoSnap.codigo?' · '+o.destinoSnap.codigo:'')):'';
  return `<div class="card oc-card sem-${sem||'no'}" onclick="abrirDetalle('${o.id}')">
    <div class="lin"><span class="oc-num">${esc(o.numero)}</span><span class="oc-total">${fmtMon(o.total,o.moneda)}</span></div>
    <div class="oc-prov">${esc(prov)}</div>
    <div class="lin"><span class="muted">${esc(dest)}${o.razonSnap?' · '+esc(o.razonSnap.nombre):''}</span><span class="badge ${o.estado}">${nombreEstado(o.estado)}</span></div>
    ${td?`<div class="oc-dias txt-${sem}"><span class="dot ${sem}"></span>${td} · ${fmtFecha(o.fechaNecesidad)}</div>`:''}
  </div>`;
}
// Cuadros de alerta de la pantalla Órdenes (tocar uno filtra la lista)
const TILES=[
  {id:'rojo', titulo:'Urgentes', color:'bad', fn:o=>semaforo(o)==='rojo'},
  {id:'amarillo', titulo:'Próximas', color:'warn', fn:o=>semaforo(o)==='amarillo'},
  {id:'verde', titulo:'En término', color:'ok', fn:o=>semaforo(o)==='verde'},
  {id:'borrador', titulo:'Borradores', color:'muted', fn:o=>o.estado==='borrador'},
  {id:'porfacturar', titulo:'Por facturar', color:'accent', fn:o=>o.estado==='recibida'},
  {id:'porpagar', titulo:'Por pagar', color:'violet', fn:o=>o.estado==='facturada'}
];
function subTile(id){
  const s=S.cfg.semaforo;
  return {rojo:`Vencidas o ≤ ${s.rojo} días`, amarillo:`Faltan ${num(s.rojo)+1} a ${s.amarillo} días`, verde:`Faltan más de ${s.amarillo} días`,
    borrador:'Sin emitir', porfacturar:'Recibidas sin factura', porpagar:'Facturadas sin pago'}[id];
}
function elegirTile(id){ S.filtros.tile = S.filtros.tile===id ? '' : id; renderInicio(); }
function nFiltros(){ const F=S.filtros; return ['estado','destino','proveedor','moneda','razon','desde','hasta'].filter(k=>F[k]).length; }
function ocsFiltradas(){
  const F=S.filtros, q=F.texto.trim().toLowerCase(), t=TILES.find(x=>x.id===F.tile);
  const l=S.ocs.filter(o=>(!t||t.fn(o))&&(!F.estado||o.estado===F.estado)&&(!F.destino||o.destinoId===F.destino)&&(!F.proveedor||o.proveedorId===F.proveedor)
    &&(!F.moneda||o.moneda===F.moneda)&&(!F.razon||o.razonId===F.razon)&&(!F.desde||o.fechaEmision>=F.desde)&&(!F.hasta||o.fechaEmision<=F.hasta)
    &&(!q||(o.numero||'').toLowerCase().includes(q)||(o.textoBusqueda||'').includes(q)));
  // con un cuadro del semáforo elegido, ordena por fecha de necesidad
  if(t&&['rojo','amarillo','verde'].includes(t.id)) l.sort((a,b)=>(a.fechaNecesidad||'').localeCompare(b.fechaNecesidad||''));
  return l;
}
function setFiltro(k,v){ S.filtros[k]=v; renderListaOC(); }
function limpiarFiltros(){ S.filtros={texto:'',estado:'',destino:'',proveedor:'',moneda:'',razon:'',desde:'',hasta:'',tile:''}; renderInicio(); }
function panelFiltros(){
  const F=S.filtros, c=S.cfg;
  return `<div class="card"><div class="fila">
    <div><label>Estado</label><select onchange="setFiltro('estado',this.value)"><option value="">Todos</option>${ESTADOS.map(e=>`<option value="${e.id}" ${sel(F.estado,e.id)}>${e.nombre}</option>`).join('')}</select></div>
    <div><label>Destino</label><select onchange="setFiltro('destino',this.value)"><option value="">Todos</option>${c.destinos.map(d=>`<option value="${d.id}" ${sel(F.destino,d.id)}>${esc(d.nombre)}${d.codigo?' ('+esc(d.codigo)+')':''}</option>`).join('')}</select></div>
    <div><label>Proveedor</label><select onchange="setFiltro('proveedor',this.value)"><option value="">Todos</option>${S.provs.map(p=>`<option value="${p.id}" ${sel(F.proveedor,p.id)}>${esc(p.razonSocial)}</option>`).join('')}</select></div>
    <div><label>Moneda</label><select onchange="setFiltro('moneda',this.value)"><option value="">Todas</option><option ${sel(F.moneda,'ARS')}>ARS</option><option ${sel(F.moneda,'USD')}>USD</option></select></div>
    <div><label>Razón social</label><select onchange="setFiltro('razon',this.value)"><option value="">Todas</option>${c.razones.map(r=>`<option value="${r.id}" ${sel(F.razon,r.id)}>${esc(r.nombre)}</option>`).join('')}</select></div>
    <div><label>Emitida desde</label><input type="date" value="${F.desde}" onchange="setFiltro('desde',this.value)"></div>
    <div><label>Emitida hasta</label><input type="date" value="${F.hasta}" onchange="setFiltro('hasta',this.value)"></div>
  </div><div class="acciones"><button class="btn" onclick="limpiarFiltros()">Limpiar filtros</button></div></div>`;
}
function renderInicio(){
  const el=$('v-inicio');
  if(!S.cfg){ el.innerHTML='<p class="muted centro">Cargando…</p>'; return; }
  const tiles=TILES.map(t=>{ const n=S.ocs.filter(t.fn).length;
    return `<button class="tile t-${t.color} ${S.filtros.tile===t.id?'activo':''} ${n?'':'vacio'}" onclick="elegirTile('${t.id}')">
      <span class="tile-lbl">${t.titulo}</span><span class="tile-num">${n}</span><span class="tile-sub">${subTile(t.id)}</span></button>`; }).join('');
  let h=`<h2 class="titulo-sec">Órdenes de compra</h2><div class="tiles">${tiles}</div>
    <div class="fila" style="margin-bottom:10px;flex-wrap:nowrap">
      <input id="f-texto" placeholder="Buscar por n° o descripción" value="${esc(S.filtros.texto)}" oninput="S.filtros.texto=this.value;renderListaOC()">
      <button class="btn" style="flex:0 0 auto" onclick="S.verFiltros=!S.verFiltros;renderInicio()">Filtros${nFiltros()?' ('+nFiltros()+')':''}</button></div>`;
  if(S.verFiltros) h+=panelFiltros();
  h+='<div id="lista-oc"></div>';
  el.innerHTML=h; renderListaOC();
}
function renderListaOC(){
  const l=ocsFiltradas(), el=$('lista-oc'); if(!el) return;
  const t=TILES.find(x=>x.id===S.filtros.tile);
  el.innerHTML = (t?`<div class="filtro-tile"><span>Mostrando: <b>${t.titulo}</b> (${l.length})</span><button class="btn chico" onclick="elegirTile('${t.id}')">Quitar filtro</button></div>`:`<div class="muted" style="margin-bottom:8px">${l.length} orden${l.length===1?'':'es'}</div>`)
    + (l.length? l.map(tarjetaOC).join('') : '<div class="card centro muted">No hay órdenes para mostrar.<br><br><button class="btn pri" onclick="nuevaOC()">Crear la primera OC</button></div>');
}

function itemVacio(){ return {codigo:'',descripcion:'',cantidad:1,unidad:(S.cfg.unidades[0]||'u'),precioUnit:0,cantRecibida:0,stockId:'',area:''}; }
// Abre el formulario: vacío, con una OC existente (editar) o con una base (duplicar)
function nuevaOC(base){
  if(!S.cfg) return;
  const c=S.cfg;
  S.form = base || {
    id:null, estado:'borrador', fechaEmision:hoy(), fechaNecesidad:'',
    proveedorId:'', proveedorSnap:null,
    razonId:(c.razones[0]||{}).id||'', destinoId:(c.destinos.find(d=>!d.archivado)||{}).id||'',
    moneda:'ARS', tipoCambio:'', items:[itemVacio()], discriminarIva:true, ivaPct:21,
    condicionPago:'', lugarEntrega:'', observaciones:'', historial:[]
  };
  if(!S.form.items.length) S.form.items=[itemVacio()];
  renderForm(); mostrarVista('oc');
}
function editarOC(id){
  const o=S.ocs.find(x=>x.id===id); if(!o) return;
  nuevaOC(JSON.parse(JSON.stringify({...o, tipoCambio:o.tipoCambio??'', tcMetricas:o.tcMetricas??'', tcManual:!!o.tcMetricas, items:(o.items||[]).map(i=>({...i}))})));
}
function duplicarOC(id){
  const o=S.ocs.find(x=>x.id===id); if(!o) return;
  nuevaOC({ id:null, estado:'borrador', fechaEmision:hoy(), fechaNecesidad:'',
    proveedorId:o.proveedorId, proveedorSnap:o.proveedorSnap, razonId:o.razonId, destinoId:o.destinoId,
    moneda:o.moneda, tipoCambio:o.tipoCambio??'', items:(o.items||[]).map(i=>({codigo:i.codigo,descripcion:i.descripcion,cantidad:i.cantidad,unidad:i.unidad,precioUnit:i.precioUnit,cantRecibida:0,stockId:i.stockId||'',area:i.area||''})),
    discriminarIva:o.discriminarIva, ivaPct:o.ivaPct, condicionPago:o.condicionPago, lugarEntrega:o.lugarEntrega, observaciones:o.observaciones, historial:[] });
  toast('Copia creada: revisala y guardala para asignarle número');
}
function opcionesDestino(actual){

}

      ${f.moneda==='USD'?`<div><label>Tipo de cambio ref. (opcional)</label><input type="number" inputmode="decimal" step="any" value="${f.tipoCambio??''}" placeholder="ARS por USD" oninput="setF('tipoCambio',this.value)"></div>`:''}
    </div>

function opcionesUnidad(actual){ const u=[...S.cfg.unidades]; if(actual&&!u.includes(actual)) u.push(actual); return u.map(x=>`<option ${sel(x,actual)}>${esc(x)}</option>`).join(''); }
function renderItems(){
  const f=S.form;
  $('items').innerHTML=f.items.map((it,i)=>{ const v=!!it.stockId;
    return `<div class="item">
    <div class="item-h"><span>Ítem ${i+1}</span>${f.items.length>1?`<button class="btn chico peligro" onclick="quitarItem(${i})">Quitar</button>`:''}</div>
    ${v?`<div class="vinculo"><span class="badge emitida">StockApp · ${esc(it.codigo)}</span><button class="btn chico" onclick="desvincular(${i})">Desvincular</button></div>`
       :`<button class="btn chico" style="margin-top:8px" onclick="modalMaterial(${i})">Elegir material de StockApp</button>`}

    <div class="muted" style="text-align:right;margin-top:6px">Total ítem: <b id="it-tot-${i}">${fmtMon(num(it.cantidad)*num(it.precioUnit),f.moneda)}</b></div>
  </div>`; }).join('');

// ---- Historial de precios: una ficha por proveedor + material (código o descripción) ----
const normTxt=t=>String(t??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
function claveItem(it){ return it.codigo ? 'c_'+it.codigo : 'd_'+normTxt(it.descripcion).slice(0,80); }
function idPrecio(provId,it){ return (provId+'__'+claveItem(it)).replace(/[\/.#\[\]$]/g,'_'); }
// Pasa un importe entre ARS y USD con el tipo de cambio de la OC o, si no hay, el dólar de StockApp
function convertir(v,de,a,tc){ if(de===a) return v; tc=num(tc)||num((S.stock.cfg||{}).dolar); if(!tc) return null; return de==='USD'? v*tc : v/tc; }
// Muestra debajo del precio: último precio pagado a este proveedor y costo en StockApp
function pistaPrecio(i){
  const f=S.form, it=f.items[i], partes=[];
  if(f.proveedorId && (it.codigo||String(it.descripcion).trim())){
    const pr=S.precios[idPrecio(f.proveedorId,it)];
    if(pr&&pr.ultimo){ const u=pr.ultimo, pc=convertir(u.precio,u.moneda,f.moneda,f.tipoCambio);
      partes.push(`Último a este proveedor: <b>${fmtMon(u.precio,u.moneda)}</b> · ${fmtFecha(u.fecha)} · ${esc(u.numero)}${pc!=null?` <button class="btn chico" onclick="usarPrecio(${i},${redondear(pc)})">Usar</button>`:''}`); }
  }
  const si=it.stockId&&S.stock.items.find(x=>x.id===it.stockId);
  if(si&&num(si.costo)>0){ const mo=si.moneda||'USD', pc=convertir(num(si.costo),mo,f.moneda,f.tipoCambio);
    partes.push(`Costo en StockApp: ${fmtMon(si.costo,mo)}${pc!=null&&mo!==f.moneda?` (≈ ${fmtMon(pc,f.moneda)})`:''}${pc!=null?` <button class="btn chico" onclick="usarPrecio(${i},${redondear(pc)})">Usar</button>`:''}`); }
  return partes.join('<br>');
}
function usarPrecio(i,v){ S.form.items[i].precioUnit=v; renderItems(); renderTotales(); }
function desvincular(i){ const it=S.form.items[i]; it.stockId=''; it.area=''; renderItems(); }
function setF(campo,valor){
  S.form[campo]=valor;
  if(campo==='moneda'){ renderForm(); return; }   // cambia qué campo de tipo de cambio se ve
  if(campo==='tcMetricas'){ S.form.tcManual=true; pistaTC(); return; }
  if(campo==='fechaEmision') pistaTC();
  if(campo==='tipoCambio'){ renderItems(); renderTotales(); }
  if(campo==='discriminarIva'){ $('f-iva-sel').style.display=valor?'':'none'; renderTotales(); }
  if(campo==='ivaPct') renderTotales();
}
function setItem(i,campo,valor){
  const it=S.form.items[i]; it[campo]=valor;
  if(campo==='cantidad'||campo==='precioUnit'){ $('it-tot-'+i).textContent=fmtMon(num(it.cantidad)*num(it.precioUnit),S.form.moneda); renderTotales(); }
}
function agregarItem(){ S.form.items.push(itemVacio()); renderItems(); renderTotales(); }
function quitarItem(i){ if(!confirm('¿Quitar el ítem '+(i+1)+'?')) return; S.form.items.splice(i,1); renderItems(); renderTotales(); }
// ---- Carga masiva: pegar filas copiadas del Sheet ----
// Columnas: Descripción | Precio unitario | Unidad | Cantidad
// Número con formato argentino: 1.234,56 · $ 1.500 · 2,5
function numAR(v){
  let s=String(v??'').replace(/[^\d.,-]/g,'');
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=parseFloat(s); return isFinite(n)?n:NaN;
}
// Usa la unidad de la lista aunque cambien mayúsculas (KG → kg); si no existe, la deja como viene
function unidadPegada(u){ u=String(u||'').trim(); if(!u) return S.cfg.unidades[0]||'u'; return S.cfg.unidades.find(x=>x.toLowerCase()===u.toLowerCase())||u; }
function leerPegado(txt){
  return String(txt||'').split(/\r?\n/).map(f=>f.split('\t').map(c=>c.trim().replace(/^"|"$/g,'')))
    .filter(c=>c[0])
    .map(c=>({descripcion:c[0], precioUnit:numAR(c[1]), unidad:unidadPegada(c[2]), cantidad:numAR(c[3])}))
    .filter(r=>!(isNaN(r.precioUnit)&&isNaN(r.cantidad))); // saltea el encabezado si se copió
}
function modalPegar(){
  abrirModal(`<h3>Pegar ítems desde planilla</h3>
    <p class="muted">Copiá en el Sheet las columnas <b>Descripción · Precio unitario · Unidad · Cantidad</b> (en ese orden) y pegalas acá.</p>
    <textarea id="pg-txt" style="min-height:140px" placeholder="Pegá acá las celdas copiadas" oninput="vistaPegado()"></textarea>
    <div id="pg-vista" style="margin-top:10px"></div>
    <div class="acciones"><button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn pri" id="pg-ok" disabled onclick="agregarPegados()">Agregar ítems</button></div>`,'ancho');
  setTimeout(()=>$('pg-txt')&&$('pg-txt').focus(),100);
}
// Vista previa de lo que entendió antes de agregar
function vistaPegado(){
  const l=leerPegado($('pg-txt').value), m=S.form.moneda;
  $('pg-ok').disabled=!l.length; $('pg-ok').textContent=l.length?`Agregar ${l.length} ítem${l.length===1?'':'s'}`:'Agregar ítems';
  $('pg-vista').innerHTML=l.length?`<table class="tabla-items"><tr><th>Descripción</th><th class="der">Cant.</th><th class="der">P. unit.</th></tr>
    ${l.map(r=>`<tr><td>${esc(r.descripcion)}</td><td class="der ${!(r.cantidad>0)?'txt-rojo':''}">${isNaN(r.cantidad)?'—':fmtCant(r.cantidad)} ${esc(r.unidad)}</td><td class="der">${isNaN(r.precioUnit)?'—':fmtMon(r.precioUnit,m)}</td></tr>`).join('')}</table>
    ${l.some(r=>!(r.cantidad>0))?'<div class="pista txt-rojo">Las filas en rojo no tienen cantidad: corregilas después en la OC.</div>':''}`

function agregarPegados(){

// Calcula subtotal, IVA y total
function calcTotales(f){
  const sub=redondear((f.items||[]).reduce((s,it)=>s+num(it.cantidad)*num(it.precioUnit),0));
  const iva=f.discriminarIva?redondear(sub*num(f.ivaPct)/100):0;
  return {subtotal:sub, iva, total:redondear(sub+iva)};
}
function renderTotales(){
  const f=S.form, t=calcTotales(f), m=f.moneda;
  $('totales').innerHTML = f.discriminarIva
    ? `<div><span>Subtotal neto</span><span>${fmtMon(t.subtotal,m)}</span></div><div><span>IVA ${fmtNum(f.ivaPct,1).replace(',0','')} %</span><span>${fmtMon(t.iva,m)}</span></div><div class="tot"><span>Total</span><span>${fmtMon(t.total,m)}</span></div>`
    : `<div class="tot"><span>Total</span><span>${fmtMon(t.total,m)}</span></div><div class="muted">Precios con IVA incluido</div>`;
}
// Verifica lo mínimo para emitir una OC
function validarOC(f){
  if(!f.proveedorId) return 'Elegí un proveedor';
  if(!f.razonId) return 'Elegí la razón social a facturar';
  if(!f.destinoId) return 'Elegí el destino interno';
  const its=(f.items||[]).filter(i=>String(i.descripcion||'').trim());
  if(!its.length) return 'Cargá al menos un ítem con descripción';
  if(its.some(i=>num(i.cantidad)<=0)) return 'Hay ítems con cantidad 0';
  return '';
}
// Arma el documento a guardar (con copias de proveedor, razón social y destino para el PDF)
function armarDatosOC(f){
  const t=calcTotales(f);
  const prov=S.provs.find(p=>p.id===f.proveedorId)||f.proveedorSnap||null;
  const r=S.cfg.razones.find(x=>x.id===f.razonId)||null;
  const d=S.cfg.destinos.find(x=>x.id===f.destinoId)||f.destinoSnap||null;
  const items=(f.items||[]).filter(it=>String(it.descripcion||'').trim()||num(it.precioUnit)).map((it,i)=>({
    n:i+1, codigo:String(it.codigo||'').trim(), descripcion:String(it.descripcion||'').trim(),
    cantidad:num(it.cantidad), unidad:it.unidad||'', precioUnit:num(it.precioUnit),
    total:redondear(num(it.cantidad)*num(it.precioUnit)), cantRecibida:num(it.cantRecibida), stockId:it.stockId||'', area:it.area||''
  }));
  return {
    estado:f.estado, fechaEmision:f.fechaEmision, fechaNecesidad:f.fechaNecesidad||'',
    proveedorId:f.proveedorId||'',
    proveedorSnap:prov?{razonSocial:prov.razonSocial||'',cuit:prov.cuit||'',contacto:prov.contacto||'',telefono:prov.telefono||'',mail:prov.mail||''}:null,
    razonId:f.razonId||'',
    razonSnap:r?{nombre:r.nombre||'',cuit:r.cuit||'',domicilio:r.domicilio||'',telefono:r.telefono||'',mail:r.mail||'',iva:r.iva||''}:null,
    destinoId:f.destinoId||'', destinoSnap:d?{nombre:d.nombre,codigo:d.codigo||'',tipo:d.tipo||'general'}:null,
    moneda:f.moneda, tipoCambio:(f.tipoCambio===''||f.tipoCambio==null)?null:num(f.tipoCambio),
    tcMetricas:f.moneda==='ARS'&&num(f.tcMetricas)>0?num(f.tcMetricas):null,
    items, discriminarIva:!!f.discriminarIva, ivaPct:num(f.ivaPct), ...t,
    condicionPago:f.condicionPago||'', lugarEntrega:f.lugarEntrega||'', observaciones:f.observaciones||'',
    textoBusqueda:[...items.map(i=>i.descripcion+' '+i.codigo), prov?prov.razonSocial:''].join(' ').toLowerCase(),
    actualizado:ts(), actualizadoPor:S.email
  };
}
function botonesOcupados(si){ ['b-guardar','b-emitir'].forEach(id=>{ if($(id)) $(id).disabled=si; }); }
// Guarda la OC (si es nueva, asigna número con transacción)
async function guardarOC(emitir){
  const f=S.form;
  if(emitir || f.estado!=='borrador'){ const err=validarOC(f); if(err) return toast(err); }
  else if(!f.proveedorId && !f.items.some(i=>String(i.descripcion).trim())) return toast('Cargá al menos el proveedor o un ítem');
  const datos=armarDatosOC(f);
  const hist=[...(f.historial||[])];
  if(!f.id) hist.push(entradaHist('borrador','Creada'));
  if(emitir && f.estado==='borrador'){ datos.estado='emitida'; hist.push(entradaHist('emitida')); }
  datos.historial=hist;
  if(!f.id){
    if(!navigator.onLine) return toast('Sin conexión: para guardar una OC nueva se necesita internet (se asigna el número).',4000);
    botonesOcupados(true);
    try{ const id=await crearOCConNumero(datos); toast('Guardada como OC '+id); S.form=null;
      if(datos.estado==='emitida') alEmitir({...datos,id,numero:'OC '+id});
      abrirDetalle(id); }
    catch(e){ errorFS(e); } finally{ botonesOcupados(false); }
  } else {
    const ok=await escribir(db.collection(COL.oc).doc(f.id).set(datos,{merge:true}),'Cambios guardados');
    if(ok){ const id=f.id; if(datos.estado==='emitida') alEmitir({...datos,id,numero:f.numero}); S.form=null; abrirDetalle(id); }
  }
}
// Numeración OC AAMM-NNN única para toda la empresa (transacción de Firestore)
async function crearOCConNumero(datos){
  const fe=new Date((datos.fechaEmision||hoy())+'T12:00:00');
  const aamm=String(fe.getFullYear()).slice(-2)+String(fe.getMonth()+1).padStart(2,'0');
  const contRef=db.collection(COL.cont).doc(aamm);
  return db.runTransaction(async tx=>{
    const c=await tx.get(contRef);
    let n=(c.exists?num(c.data().ultimo):0)+1, id, ref;
    for(let k=0;k<30;k++){ // por seguridad: salta números ya usados
      id=aamm+'-'+String(n).padStart(3,'0'); ref=db.collection(COL.oc).doc(id);
      const ex=await tx.get(ref); if(!ex.exists) break; n++;
    }
    tx.set(contRef,{ultimo:n, actualizado:ts()},{merge:true});
    tx.set(ref,{...datos, numero:'OC '+id, aamm, correlativo:n, creado:ts(), creadoPor:S.email});
    return id;
  });
}

// Al emitir: guarda los precios en el historial y marca "pedido en curso" en StockApp
function alEmitir(o){
  const b=db.batch(); let n=0;
  (o.items||[]).forEach(it=>{
    if(o.proveedorId && num(it.precioUnit)>0 && (it.codigo||String(it.descripcion||'').trim())){
      const e={precio:num(it.precioUnit),moneda:o.moneda,fecha:o.fechaEmision,numero:o.numero,ocId:o.id,conIva:!o.discriminarIva};
      b.set(db.collection(COL.precios).doc(idPrecio(o.proveedorId,it)),{proveedorId:o.proveedorId,proveedor:(o.proveedorSnap||{}).razonSocial||'',
        codigo:it.codigo||'',descripcion:it.descripcion,ultimo:e,lista:firebase.firestore.FieldValue.arrayUnion(e),actualizado:ts()},{merge:true}); n++;
    }
    if(it.stockId && S.stock.items.some(x=>x.id===it.stockId) && num(it.cantRecibida)<num(it.cantidad)){
      b.set(db.collection(SCOL.items).doc(it.stockId),{pedidoCurso:{fecha:Date.now(),cantidad:num(it.cantidad),oc:o.numero},actualizado:Date.now()},{merge:true}); n++;
    }
  });
  if(n) escribir(b.commit());
}
// Al anular: quita el "pedido en curso" que había marcado esta OC
function quitarPedidos(o){
  const b=db.batch(); let n=0;
  (o.items||[]).forEach(it=>{ const si=it.stockId&&S.stock.items.find(x=>x.id===it.stockId);
    if(si&&si.pedidoCurso&&si.pedidoCurso.oc===o.numero){ b.set(db.collection(SCOL.items).doc(si.id),{pedidoCurso:null,actualizado:Date.now()},{merge:true}); n++; } });
  if(n) escribir(b.commit());
}

const r3 = n => Math.round(n*1000)/1000;
// Medidas como las muestra StockApp: formato · material · espesor × ancho × largo mm
function medidasTxt(m){
  const d=m.medidas||{}, p=[];
  if(d.diametro) p.push('Ø '+fmtCant(d.diametro)); if(d.espesor) p.push(fmtCant(d.espesor)); if(d.ancho) p.push(fmtCant(d.ancho)); if(d.largo) p.push(fmtCant(d.largo));
  return [m.subId?'':m.formato, m.material, p.length?p.join(' × ')+' mm':''].filter(Boolean).join(' · ');
}
// Descripción que va a la OC: la de StockApp + medidas (si no están ya en la descripción)
function descMaterial(m){ const md=medidasTxt(m); return md && !normTxt(m.descripcion).includes(normTxt(md)) ? m.descripcion+' · '+md : m.descripcion; }
function modalMaterial(i){

}
function listaMateriales(){
  const pal=normTxt($('mm-buscar').value).split(' ').filter(Boolean);
  const l=S.stock.items.filter(m=>{ const t=normTxt([m.codigo,m.descripcion,m.material,m.formato,medidasTxt(m)].join(' ')); return pal.every(p=>t.includes(p)); })
    .sort((a,b)=>String(a.codigo).localeCompare(String(b.codigo),'es',{numeric:true})).slice(0,60);
  $('mm-lista').innerHTML = l.map(m=>`<div onclick="elegirMaterial('${m.id}')"><b>${esc(m.codigo)}</b> ${esc(m.descripcion)}
      <div class="muted">${esc((AREAS[m.area]||{}).n||'')}${medidasTxt(m)?' · '+esc(medidasTxt(m)):''} · Stock ${fmtCant(m.stock)} ${esc(m.unidad||'')}${m.pedidoCurso?' · Pedido en curso':''}</div></div>`).join('')

function elegirMaterial(id,datos){
  const m=datos||S.stock.items.find(x=>x.id===id), it=S.form&&S.form.items[S.matItem]; if(!m||!it) return;
  Object.assign(it,{stockId:id, area:m.area, codigo:m.codigo, descripcion:descMaterial(m), unidad:m.unidad||it.unidad});
  // si no tiene precio, toma el último pagado a este proveedor (misma moneda)
  const pr=S.form.proveedorId&&S.precios[idPrecio(S.form.proveedorId,it)];
  if(!num(it.precioUnit) && pr && pr.ultimo && pr.ultimo.moneda===S.form.moneda) it.precioUnit=pr.ultimo.precio;
  cerrarModal(); renderItems(); renderTotales();
}

// Costo para StockApp: sin IVA (si la OC tiene precios finales, se le saca el IVA)
function costoNeto(precio,o){ return o.discriminarIva ? num(precio) : redondear(num(precio)/(1+(num(o.ivaPct)||21)/100)); }
async function crearMaterial(){
  const a=$('nm-area').value, desc=$('nm-desc').value.trim(); if(!desc) return toast('Escribí la descripción');
  if(!navigator.onLine) return toast('Para crear un material se necesita internet (se asigna el código).',4000);
  const it=S.form.items[S.matItem], cat=(((S.stock.cfg||{}).categorias||{})[a]||[]).find(x=>x.id===$('nm-cat').value);
  const sub=cat&&(cat.subs||[]).find(x=>x.id===$('nm-sub').value);
  const base={descripcion:desc, catId:cat?cat.id:'', subId:sub?sub.id:'', unidad:$('nm-uni').value, minimo:0, cantPedido:num(it.cantidad)>0?num(it.cantidad):1,
    marca:$('nm-marca').value.trim(), proveedor:$('nm-prov').value.trim(), marcasSug:[], ubicacion:'', obs:'Alta desde ComprasApp', plazo:0,
    costo:costoNeto(it.precioUnit,S.form), moneda:S.form.moneda, material:$('nm-mat').value.trim(), area:a, stock:0, pedidoCurso:null, creado:Date.now(), actualizado:Date.now()};
  if(AREAS[a].tec){ base.formato=sub?sub.nombre:''; base.medidas={espesor:num($('nm-esp').value),diametro:num($('nm-dia').value),ancho:num($('nm-anc').value),largo:num($('nm-lar').value)}; }
  $('nm-ok').disabled=true;
  try{ const r=await crearItemStock(base); toast('Material '+r.codigo+' creado en StockApp'); elegirMaterial(r.id,{...base,codigo:r.codigo}); }
  catch(e){ errorFS(e); if($('nm-ok')) $('nm-ok').disabled=false; }
}
// Código PA-/AC-/NF-/PL-/CO- con el contador compartido con StockApp (transacción: nunca se repite)
async function crearItemStock(base){
  const p=AREAS[base.area].p, cont=db.doc(SCOL.cfg+'/codigos'), ref=db.collection(SCOL.items).doc();
  let maxLocal=0; S.stock.items.forEach(i=>{ if(i.area===base.area){ const n=parseInt(String(i.codigo).split('-')[1]); if(n>maxLocal) maxLocal=n; } });
  let codigo='';
  await db.runTransaction(async tx=>{
    const c=await tx.get(cont), n=Math.max(num(c.exists?(c.data()||{})[p]:0),maxLocal)+1;
    codigo=p+'-'+String(n).padStart(4,'0');
    tx.set(cont,{[p]:n},{merge:true}); tx.set(ref,{...base,codigo});
  });
  return {id:ref.id,codigo};
}

async function guardarRecepcion(id){
  const o=S.ocs.find(x=>x.id===id), fecha=$('r-fecha').value, remito=$('r-remito').value.trim(), obs=$('r-obs').value.trim();
  if(!fecha) return toast('Completá la fecha');
  const cant=(o.items||[]).map((it,k)=>num($('r-c'+k).value));
  if(cant.some(c=>c<0)) return toast('Las cantidades no pueden ser negativas');
  if(!cant.some(c=>c>0)) return toast('Cargá al menos una cantidad recibida');
  const alStock=!!($('r-stock')&&$('r-stock').checked), conCosto=!!($('r-costo')&&$('r-costo').checked);
  const items=o.items.map((it,k)=>({...it,cantRecibida:r3(num(it.cantRecibida)+cant[k])}));
  const completa=items.every(it=>it.cantRecibida>=num(it.cantidad)-1e-9);
  const nuevo=['emitida','parcial'].includes(o.estado)?(completa?'recibida':'parcial'):o.estado;
  const b=db.batch(), recRef=db.collection(COL.rec).doc(), movs=[], refTxt=o.numero+(remito?' · Remito '+remito:'');
  if(alStock) o.items.forEach((it,k)=>{
    const si=it.stockId&&S.stock.items.find(x=>x.id===it.stockId); if(!si||!(cant[k]>0)) return;
    const mref=db.collection(SCOL.movs).doc(); movs.push(mref.id);
    // movimiento con el mismo formato que usa StockApp
    b.set(mref,{itemId:si.id,codigo:si.codigo,descripcion:si.descripcion,area:si.area,unidad:si.unidad,tipo:'entrada',cantidad:cant[k],motivo:'Compra',ref:refTxt,
      usuario:S.nombre,email:S.email,fecha:Date.now(),stockRes:r3(num(si.stock)+cant[k]),origen:'ComprasApp',ocId:o.id});
    const patch={stock:firebase.firestore.FieldValue.increment(cant[k]),actualizado:Date.now()};
    if(items[k].cantRecibida>=num(it.cantidad)-1e-9) patch.pedidoCurso=null;      // ítem completo: ya no está "en curso"
    if(conCosto&&num(it.precioUnit)>0){ patch.costo=costoNeto(it.precioUnit,o); patch.moneda=o.moneda; }
    b.set(db.collection(SCOL.items).doc(si.id),patch,{merge:true});
  });
  b.set(recRef,{ocId:o.id,numero:o.numero,fecha,remito,obs,alStock,movimientos:movs,usuario:S.email,creado:ts(),
    items:o.items.map((it,k)=>({n:it.n,codigo:it.codigo||'',stockId:it.stockId||'',descripcion:it.descripcion,unidad:it.unidad,cantidad:cant[k]})).filter(x=>x.cantidad>0)});
  b.update(db.collection(COL.oc).doc(o.id),{items,estado:nuevo,actualizado:ts(),actualizadoPor:S.email,
    historial:firebase.firestore.FieldValue.arrayUnion(entradaHist(nuevo,(remito?'Remito '+remito:'Recepción sin remito')+(movs.length?' · ingresado a StockApp':'')))});
  cerrarModal();
  await escribir(b.commit(),'Recepción registrada'+(movs.length?` · ${movs.length} ingreso(s) en StockApp`:''));
}

const CASAS_DOLAR={oficial:'Oficial (BNA venta)',bolsa:'MEP',blue:'Blue'};
function casaDolar(){ return (S.cfg&&S.cfg.dolarMet)||'oficial'; }
// Descarga una vez por sesión el histórico (ArgentinaDatos) y el valor de hoy (DolarApi)
function cargarDolar(){
  const casa=casaDolar();
  if(S.dolar.casa===casa && S.dolar.cargando) return S.dolar.cargando;
  S.dolar={casa,hoy:null,serie:null,cargando:null,listo:false};
  const getJ=u=>fetch(u).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); });
  S.dolar.cargando=Promise.allSettled([
    getJ('https://api.argentinadatos.com/v1/cotizaciones/dolares/'+casa),
    getJ('https://dolarapi.com/v1/dolares/'+casa)
  ]).then(([h,a])=>{
    if(h.status==='fulfilled'&&Array.isArray(h.value))
      S.dolar.serie=h.value.filter(x=>num(x.venta)>0).map(x=>({f:String(x.fecha).slice(0,10),v:num(x.venta)})).sort((a,b)=>a.f.localeCompare(b.f));
    if(a.status==='fulfilled'&&a.value&&num(a.value.venta)>0) S.dolar.hoy=num(a.value.venta);
    S.dolar.listo=true; return S.dolar;
  });
  return S.dolar.cargando;
}
const hayDolarApi=()=>!!(S.dolar.hoy||(S.dolar.serie&&S.dolar.serie.length));
// Dólar de una fecha (ese día o el último hábil anterior). Sin datos: el dólar de StockApp
function dolarDe(fecha){
  const d=S.dolar;
  if((!fecha||fecha>=hoy()) && d.hoy) return d.hoy;
  if(d.serie&&d.serie.length){ let v=null; for(const x of d.serie){ if(x.f<=fecha) v=x.v; else break; } if(v) return v; }
  return num((S.stock.cfg||{}).dolar)||null;
}
// Dólar que usan las métricas para una OC en pesos
function tcMet(o){ return num(o.tcMetricas)||num(o.tipoCambio)||dolarDe(o.fechaEmision); }
function aUSD(o){ if(o.moneda==='USD') return num(o.total); const tc=tcMet(o); return tc?num(o.total)/tc:null; }
// Sugerencia en el formulario: se completa sola mientras no lo cambies a mano
function pistaTC(){
  const f=S.form, el=$('f-tcmet-pista'); if(!f||!el) return;
  const v=dolarDe(f.fechaEmision);
  if(!v){ el.textContent=S.dolar.listo?'No se pudo obtener el dólar (¿sin internet?). Cargalo a mano.':'Buscando el dólar del día…'; return; }
  const sug=redondear(v);
  if(!f.tcManual){ f.tcMetricas=sug; if($('f-tcmet')) $('f-tcmet').value=sug; }
  el.innerHTML=`${hayDolarApi()?`Dólar ${esc(CASAS_DOLAR[casaDolar()])} del ${fmtFecha(f.fechaEmision)}`:'Dólar cargado en StockApp'}: <b>$ ${fmtNum(v)}</b>`
    +(f.tcManual&&num(f.tcMetricas)!==sug?` <button class="btn chico" onclick="usarTC(${sug})">Usar</button>`:'');
}
async function sugerirTC(){ if(!S.form||S.form.moneda!=='ARS') return; pistaTC(); await cargarDolar(); pistaTC(); }
function usarTC(v){ S.form.tcMetricas=v; S.form.tcManual=false; if($('f-tcmet')) $('f-tcmet').value=v; pistaTC(); }

const fmtCorto = n => num(n).toLocaleString('es-AR',{notation:'compact',maximumFractionDigits:1});
// Importe de una OC en pesos (USD × tipo de cambio de la OC o dólar de StockApp)
function desdePeriodo(p){
  const d=new Date(), f=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-01';
  if(p==='mes') return f(d);
  if(p==='tres'){ d.setMonth(d.getMonth()-2); return f(d); }
  if(p==='anio') return d.getFullYear()+'-01-01';
  return '';
}
function barrasH(lista){
  if(!lista.length) return '<div class="muted">Sin datos en este período.</div>';
  const max=Math.max(...lista.map(x=>x.v),1);
  return `<div class="barras">${lista.map(x=>`<div class="barra-f"><span class="nom">${esc(x.n)}</span><span class="val">US$ ${fmtCorto(x.v)}</span>
    <span class="pista-b"><i style="width:${Math.max(1,x.v/max*100)}%"></i></span></div>`).join('')}</div>`;
}
function agrupar(ocs,clave){
  const m={}; ocs.forEach(o=>{ const v=aUSD(o); if(v==null) return; const k=clave(o)||'Sin dato'; m[k]=(m[k]||0)+v; });
  const l=Object.entries(m).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);
  if(l.length>8){ const otros=l.slice(7).reduce((s,x)=>s+x.v,0); return [...l.slice(0,7),{n:'Otros',v:otros}]; }
  return l;
}
function renderMetricas(){
  const el=$('v-metricas'); if(!S.cfg){ el.innerHTML='<p class="muted centro">Cargando…</p>'; return; }
  if(!(S.dolar.casa===casaDolar()&&S.dolar.cargando)) cargarDolar().then(()=>{ if(S.vista==='metricas') renderMetricas(); });
  const P={mes:'Este mes',tres:'Últimos 3 meses',anio:'Este año',todo:'Todo'}, desde=desdePeriodo(S.metPeriodo);
  const base=S.ocs.filter(o=>o.estado!=='anulada'&&(!desde||o.fechaEmision>=desde));
  const grupos=[
    {t:'Emitidas', c:'accent', l:base.filter(o=>o.estado!=='borrador')},
    {t:'Pendientes', s:'Borradores', c:'muted', l:base.filter(o=>o.estado==='borrador')},
    {t:'En espera', s:'De recepción', c:'warn', l:base.filter(o=>['emitida','parcial'].includes(o.estado))},
    {t:'Facturadas', c:'violet', l:base.filter(o=>o.estado==='facturada')},
    {t:'Pagadas', c:'ok', l:base.filter(o=>o.estado==='pagada')}
  ];
  const suma=(l,mon)=>l.filter(o=>o.moneda===mon).reduce((s,o)=>s+num(o.total),0);
  const sumaUSD=l=>l.reduce((s,o)=>s+(aUSD(o)||0),0);
  const emit=grupos[0].l, sinTC=emit.filter(o=>aUSD(o)==null).length, totUSD=sumaUSD(emit);
  const estim=emit.filter(o=>o.moneda==='ARS'&&!num(o.tcMetricas)&&!num(o.tipoCambio)).length;
  // últimos 12 meses (siempre, sin importar el período elegido)
  const hoyD=new Date(), meses=[];
  for(let k=11;k>=0;k--){ const d=new Date(hoyD.getFullYear(),hoyD.getMonth()-k,1); meses.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),m:d.toLocaleDateString('es-AR',{month:'short'}).replace('.',''),v:0}); }
  S.ocs.filter(o=>!['anulada','borrador'].includes(o.estado)).forEach(o=>{ const x=meses.find(m=>m.k===(o.fechaEmision||'').slice(0,7)); const v=aUSD(o); if(x&&v!=null) x.v+=v; });
  const maxM=Math.max(...meses.map(m=>m.v),1);
  el.innerHTML=`<h2 class="titulo-sec">Métricas</h2>
    <div class="periodos">${Object.entries(P).map(([k,n])=>`<button class="btn chico ${S.metPeriodo===k?'activo':''}" onclick="S.metPeriodo='${k}';renderMetricas()">${n}</button>`).join('')}</div>
    <div class="tiles">${grupos.map(g=>`<div class="tile t-${g.c}" style="cursor:default">
      <span class="tile-lbl">${g.t}</span><span class="tile-num">${g.l.length}</span>
      <span class="met-mon"><b>US$ ${fmtNum(sumaUSD(g.l),0)}</b></span>
      <span class="tile-sub">$ ${fmtNum(suma(g.l,'ARS'),0)} + US$ ${fmtNum(suma(g.l,'USD'),0)}</span>
      ${g.s?`<span class="tile-sub">${g.s}</span>`:''}</div>`).join('')}

// =====================================================================
// 9) PDF DE LA OC (jsPDF + AutoTable)
// =====================================================================
function generarPDF(o){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210, M=14, m=o.moneda; let y=M;
  const rc=S.cfg.razones.find(x=>x.id===o.razonId)||{};
  const r={...(o.razonSnap||{})};
  // Logo y datos de la razón social
  let xT=M;
  if(rc.logo){ const h=22, w=Math.min(45,h*((rc.logoW||1)/(rc.logoH||1))); try{ doc.addImage(rc.logo,'JPEG',M,y,w,h); xT=M+w+4; }catch(e){} }
  const anchoT=W-M-66-xT;
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  const nom=doc.splitTextToSize(r.nombre||'',anchoT); doc.text(nom,xT,y+5);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  let yl=y+5+nom.length*5;
  [r.cuit?'CUIT: '+r.cuit:'', r.iva||'', r.domicilio||'', [r.telefono,r.mail].filter(Boolean).join(' · ')].filter(Boolean)
    .forEach(l=>{ const t=doc.splitTextToSize(l,anchoT); doc.text(t,xT,yl); yl+=t.length*4; });
  // Recuadro con número y fechas
  const bx=W-M-62; doc.setDrawColor(60); doc.roundedRect(bx,y,62,27,2,2);
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text('ORDEN DE COMPRA',bx+31,y+6,{align:'center'});
  doc.setFontSize(14); doc.text(o.numero,bx+31,y+13,{align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  doc.text('Fecha de emisión: '+fmtFecha(o.fechaEmision),bx+3,y+19.5);
  doc.text('Fecha de necesidad: '+fmtFecha(o.fechaNecesidad),bx+3,y+24);
  if(o.estado==='anulada'){ doc.setTextColor(200,30,30); doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('ANULADA',bx+31,y+33,{align:'center'}); doc.setTextColor(0); }
  y=Math.max(yl,y+27)+6;
  // Datos del proveedor
  const p=o.proveedorSnap||{};
  const lp=[p.razonSocial||'', p.cuit?'CUIT: '+p.cuit:'', p.contacto?'Contacto: '+p.contacto:'', [p.telefono,p.mail].filter(Boolean).join(' · ')].filter(Boolean);
  const hP=8+lp.length*4.5;
  doc.setDrawColor(180); doc.rect(M,y,W-2*M,hP);
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(90); doc.text('PROVEEDOR',M+3,y+4.5); doc.setTextColor(0);
  doc.setFontSize(9.5); lp.forEach((l,i)=>{ doc.setFont('helvetica',i===0?'bold':'normal'); doc.text(l,M+3,y+9+i*4.5); });
  y+=hP+5;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text(`Moneda: ${m==='USD'?'Dólares (USD)':'Pesos (ARS)'}${o.tipoCambio&&m==='USD'?'     T.C. ref.: $ '+fmtNum(o.tipoCambio):''}`,M,y);
  y+=4;
  // Tabla de ítems
  doc.autoTable({
    startY:y, margin:{left:M,right:M},
    head:[['Ítem','Código','Descripción','Cant.','Unid.','P. unitario','Total']],
    body:(o.items||[]).map(it=>[it.n,it.codigo||'',it.descripcion,fmtCant(it.cantidad),it.unidad,fmtNum(it.precioUnit),fmtNum(it.total)]),
    styles:{fontSize:8.5,cellPadding:1.8,valign:'middle'}, headStyles:{fillColor:[31,111,235]},
    columnStyles:{0:{halign:'center',cellWidth:10},1:{cellWidth:22},3:{halign:'right',cellWidth:15},4:{cellWidth:13},5:{halign:'right',cellWidth:26},6:{halign:'right',cellWidth:28}}
  });
  y=doc.lastAutoTable.finalY+5;
  if(y>235){ doc.addPage(); y=M; }
  // Totales
  const xl=W-M-70, xr=W-M, sim=m==='USD'?'US$ ':'$ ';
  doc.setFontSize(9.5);
  if(o.discriminarIva){
    doc.text('Subtotal neto',xl,y); doc.text(sim+fmtNum(o.subtotal),xr,y,{align:'right'}); y+=5;
    doc.text('IVA '+String(o.ivaPct).replace('.',',')+' %',xl,y); doc.text(sim+fmtNum(o.iva),xr,y,{align:'right'}); y+=2;
    doc.setDrawColor(150); doc.line(xl,y,xr,y); y+=5;
  }
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('TOTAL '+m,xl,y); doc.text(sim+fmtNum(o.total),xr,y,{align:'right'}); y+=5;
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  if(!o.discriminarIva){ doc.text('Precios con IVA incluido',xr,y,{align:'right'}); y+=5; }
  y+=3;
  // Condiciones y observaciones
  doc.setFontSize(9);
  const bloque=(tit,txt)=>{ if(!txt) return; const t=doc.splitTextToSize(txt,W-2*M-38); if(y+t.length*4.5>265){doc.addPage();y=M;}
    doc.setFont('helvetica','bold'); doc.text(tit,M,y); doc.setFont('helvetica','normal'); doc.text(t,M+38,y); y+=t.length*4.5+2; };
  bloque('Condición de pago:',o.condicionPago); bloque('Lugar de entrega:',o.lugarEntrega); bloque('Observaciones:',o.observaciones);
  // Pie de página
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(7.5); doc.setTextColor(130); doc.text(`${o.numero} · Página ${i} de ${n}`,W/2,292,{align:'center'}); doc.setTextColor(0); }
  return doc;
}
// Carga una librería externa solo cuando se necesita
function cargarScript(src){
  return new Promise((ok,mal)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok();
    const sc=document.createElement('script'); sc.src=src; sc.onload=ok; sc.onerror=()=>mal(new Error('No se pudo cargar '+src)); document.head.appendChild(sc); });
}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function cargarPdfJs(){
  if(!window.pdfjsLib) await cargarScript(PDFJS+'pdf.min.js');
  if(!window.pdfjsWorker) await cargarScript(PDFJS+'pdf.worker.min.js'); // se usa en la misma página (funciona en teléfono y vista previa)
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';
}
// modo: 'ver' (muestra el PDF en pantalla) o 'compartir' (WhatsApp, mail, etc. del teléfono)
async function pdfOC(id,modo){
  const o=S.ocs.find(x=>x.id===id);
  if(!window.jspdf) return toast('No se cargó la librería de PDF (revisá la conexión).');
  const doc=generarPDF(o);
  if(modo==='compartir') return compartirPDF(o,doc);
  verPDF(o,doc);
}
// Dibuja cada hoja del PDF como imagen dentro de una ventana
async function verPDF(o,doc){
  abrirModal(`<div class="lin"><h3 style="margin:0">${esc(o.numero)}</h3><button class="btn chico" onclick="cerrarModal()">Cerrar</button></div>
    <div id="pdf-hojas" class="pdf-hojas"><p class="muted centro">Generando vista del PDF…</p></div>
    <div class="acciones"><button class="btn" onclick="descargarPDF('${o.id}')">Descargar</button><button class="btn pri" onclick="pdfOC('${o.id}','compartir')">Compartir</button></div>`,'ancho');
  try{
    await cargarPdfJs();
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(doc.output('arraybuffer')),isEvalSupported:false}).promise;
    const cont=$('pdf-hojas'); cont.innerHTML='';
    const ancho=cont.clientWidth||360, dpr=Math.min(window.devicePixelRatio||1,2);
    for(let i=1;i<=pdf.numPages;i++){
      const pg=await pdf.getPage(i), k=ancho/pg.getViewport({scale:1}).width, vp=pg.getViewport({scale:k*dpr});
      const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; c.style.width='100%'; cont.appendChild(c);
      await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    }
  }catch(e){ console.error(e); if($('pdf-hojas')) $('pdf-hojas').innerHTML='<p class="muted centro">No se pudo mostrar la vista. Usá "Descargar" para abrir el PDF.</p>'; }
}
async function compartirPDF(o,doc){
  const nombre=o.numero.replace(/\s/g,'_')+'.pdf';
  const file=new File([doc.output('blob')],nombre,{type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:o.numero, text:`Orden de compra ${o.numero}`}); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }
  toast('Este dispositivo no permite compartir archivos: se descarga el PDF.');
  doc.save(nombre);
}
function descargarPDF(id){ const o=S.ocs.find(x=>x.id===id); generarPDF(o).save(o.numero.replace(/\s/g,'_')+'.pdf'); }

// --- Razones sociales ---
function comprimirImagen(file,max=400){
  return new Promise((ok,mal)=>{ const fr=new FileReader(); fr.onerror=mal; fr.onload=e=>{ const img=new Image(); img.onerror=mal; img.onload=()=>{
    const k=Math.min(1,max/Math.max(img.width,img.height)), w=Math.round(img.width*k), h=Math.round(img.height*k);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const x=cv.getContext('2d');
    x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
    ok({data:cv.toDataURL('image/jpeg',0.8),w,h}); }; img.src=e.target.result; }; fr.readAsDataURL(file); });
}
async function cargarLogo(i,input){
  const f=input.files[0]; if(!f) return;
  try{ const r=await comprimirImagen(f); if(r.data.length>250000) return toast('El logo quedó muy pesado, probá con una imagen más simple'); S.logoTmp[i]=r; renderConfig(); toast('Logo listo: tocá "Guardar razón social"'); }
  catch(e){ toast('No se pudo leer la imagen'); }
}
async function guardarRazon(i){
  const v=k=>$(`r${i}-${k}`).value.trim();
  const ant=S.cfg.razones[i]||{};
  const r={id:ant.id||('r'+(i+1)), nombre:v('nombre'), cuit:v('cuit'), iva:$(`r${i}-iva`).value, domicilio:v('domicilio'), telefono:v('telefono'), mail:v('mail'),
    logo:ant.logo||'', logoW:ant.logoW||0, logoH:ant.logoH||0};
  if(!r.nombre||!r.cuit) return toast('Completá nombre y CUIT');
  if(S.logoTmp[i]===null){ r.logo=''; r.logoW=0; r.logoH=0; }
  else if(S.logoTmp[i]){ r.logo=S.logoTmp[i].data; r.logoW=S.logoTmp[i].w; r.logoH=S.logoTmp[i].h; }
  const lista=[...S.cfg.razones]; lista[i]=r;
  delete S.logoTmp[i];
  await guardarCfg({razones:lista.filter(Boolean)},'Razón social guardada');
}
async function borrarRazon(i){
  if(!confirm('¿Borrar esta razón social? Las OC ya hechas conservan sus datos.')) return;
  const lista=[...S.cfg.razones]; lista.splice(i,1); delete S.logoTmp[i];
  await guardarCfg({razones:lista},'Razón social borrada');
}
// --- Correos autorizados (solo el dueño puede modificarlos) ---
// --- Usuarios: permiso "Compras" (solo el administrador) ---
async function permisoCompras(email,valor){
  if(!S.esAdmin) return toast('Solo el administrador puede cambiar permisos');
  await escribir(db.collection(SCOL.usuarios).doc(email).set({compras:!!valor},{merge:true}),valor?'Permiso Compras activado':'Permiso Compras quitado');
}
// --- Destinos / proyectos ---
async function agregarDestino(){
  const nombre=$('d-nombre').value.trim(); if(!nombre) return toast('Escribí el nombre del destino');
  const d={id:'d'+Date.now().toString(36), nombre, tipo:$('d-tipo').value, codigo:$('d-codigo').value.trim(), archivado:false};
  await guardarCfg({destinos:[...S.cfg.destinos,d]},'Destino agregado');
}
async function archivarDestino(id){ await guardarCfg({destinos:S.cfg.destinos.map(d=>d.id===id?{...d,archivado:!d.archivado}:d)}); }
async function borrarDestino(id){
  const usadas=S.ocs.filter(o=>o.destinoId===id).length;
  if(!confirm(`¿Borrar este destino?${usadas?` Está usado en ${usadas} OC: conviene archivarlo en lugar de borrarlo.`:''}`)) return;
  await guardarCfg({destinos:S.cfg.destinos.filter(d=>d.id!==id)},'Destino borrado');
}
// --- Semáforo y unidades ---
async function guardarSemaforo(){
  const am=parseInt($('s-am').value), ro=parseInt($('s-ro').value);
  if(!(am>ro && ro>=0)) return toast('"Amarillo" debe ser mayor que "rojo"');
  await guardarCfg({semaforo:{amarillo:am,rojo:ro}});
}
async function agregarUnidad(){ const u=$('u-nueva').value.trim(); if(!u) return; if(S.cfg.unidades.includes(u)) return toast('Ya existe'); await guardarCfg({unidades:[...S.cfg.unidades,u]},'Unidad agregada'); }
async function quitarUnidad(i){ if(!confirm(`¿Quitar la unidad "${S.cfg.unidades[i]}"?`)) return; const l=[...S.cfg.unidades]; l.splice(i,1); await guardarCfg({unidades:l},'Unidad quitada'); }
// --- Compartir app ---
async function compartirApp(){
  const url=location.href.split('#')[0];
  if(navigator.share){ try{ await navigator.share({title:'ComprasApp',text:'Órdenes de compra',url}); return; }catch(e){ if(e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(url); toast('Enlace copiado'); }catch(e){ prompt('Copiá el enlace:',url); }
}
